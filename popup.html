<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolveMangu Vision</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; color: #1b241c; background: #f2f4ed; }
    * { box-sizing: border-box; }
    body { width: 360px; max-height: 560px; margin: 0; padding: 18px; overflow-y: auto; }
    header { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid #cbd1c4; }
    .mark { display: grid; place-items: center; width: 32px; height: 32px; background: #76b900; color: #172000; font: bold 16px Arial, sans-serif; }
    h1 { margin: 0; font-size: 19px; font-weight: 600; }
    .eyebrow { margin: 2px 0 0; color: #64705e; font: 10px Arial, sans-serif; letter-spacing: 0; text-transform: uppercase; }
    .section { padding: 15px 0; border-bottom: 1px solid #cbd1c4; }
    .section-title { margin: 0 0 10px; font: bold 12px Arial, sans-serif; }
    label { display: block; margin-bottom: 5px; color: #56604f; font: bold 11px Arial, sans-serif; }
    input { width: 100%; padding: 9px 10px; border: 1px solid #aeb8a5; border-radius: 3px; background: #fff; color: #1b241c; font: 13px Arial, sans-serif; }
    button { min-height: 34px; padding: 8px 11px; border: 0; border-radius: 3px; background: #76b900; color: #172000; font: bold 12px Arial, sans-serif; cursor: pointer; }
    button:hover { background: #68a500; }
    button:disabled { cursor: wait; opacity: 0.65; }
    .secondary { border: 1px solid #aeb8a5; background: transparent; color: #303a2d; }
    .secondary:hover { background: #e3e8dc; }
    .danger { border: 1px solid #c5a6a0; background: transparent; color: #8b3329; }
    .key-row, .history-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .key-status { display: flex; align-items: center; gap: 6px; color: #456c17; font: 12px Arial, sans-serif; }
    .key-status::before { width: 7px; height: 7px; border-radius: 50%; background: #76b900; content: ""; }
    #keyForm { display: grid; gap: 8px; }
    #keyForm[hidden], #activeKey[hidden] { display: none; }
    #message { min-height: 16px; margin: 8px 0 0; color: #5f6a58; font: 11px Arial, sans-serif; }
    #message.error { color: #a12828; }
    .history-heading { margin-bottom: 8px; }
    .history-heading .section-title { margin: 0; }
    #history { max-height: 300px; overflow-y: auto; }
    .empty { margin: 10px 0 0; color: #65705e; font: 12px Arial, sans-serif; }
    .entry { padding: 9px 0; border-top: 1px solid #d7dcd1; }
    .entry summary { cursor: pointer; font: 12px Arial, sans-serif; }
    .entry time { display: block; margin-top: 4px; color: #6d7667; font-size: 10px; }
    .entry img { display: block; width: 100%; max-height: 160px; margin-top: 9px; object-fit: contain; background: #e4e8df; }
    .answer { margin: 8px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.45 Arial, sans-serif; }
    .prompt { margin: 8px 0 0; color: #56604f; font: italic 11px/1.4 Arial, sans-serif; }
  </style>
</head>
<body>
  <header>
    <div class="mark" aria-hidden="true">S</div>
    <div><h1>SolveMangu Vision</h1><p class="eyebrow">OCR local · OpenRouter</p></div>
  </header>

  <section class="section" aria-labelledby="keyTitle">
    <div class="key-row" id="activeKey" hidden>
      <p class="section-title key-status" id="keyTitle">OpenRouter activa</p>
      <button class="danger" id="deleteKey" type="button">Borrar</button>
    </div>
    <form id="keyForm">
      <label for="apiKey" id="keyLabel">Configura tu API Key de OpenRouter</label>
      <input type="password" id="apiKey" placeholder="sk-or-v1-..." autocomplete="off" required>
      <button id="saveKey" type="submit">Guardar clave</button>
    </form>
    <p id="message" role="status" aria-live="polite"></p>
  </section>

  <section class="section" aria-labelledby="historyTitle">
    <div class="history-heading"><h2 class="section-title" id="historyTitle">Historial de consultas</h2></div>
    <div id="history" aria-live="polite"></div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
